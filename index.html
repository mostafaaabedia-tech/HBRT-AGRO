<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08130e">
<meta name="description" content="Watch and control your HBRT smart greenhouse from anywhere.">
<title>HBRT Agro</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>
  // theme + language before first paint, so nothing flashes
  try {
    var th = JSON.parse(localStorage.getItem("hbrt.theme") || '"system"');
    if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
    var lg = JSON.parse(localStorage.getItem("hbrt.lang") || "null") || (navigator.language || "en").slice(0, 2);
    if (lg === "fa" || lg === "ps") { document.documentElement.lang = lg; document.documentElement.dir = "rtl"; }
  } catch (e) {}
</script>
<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<section id="welcome" class="welcome" hidden></section>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="#" id="logo" aria-label="HBRT Agro"><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-leaf"/></svg><span>HBRT<b>.</b></span></a>
      <button class="pick" id="pickBtn" aria-haspopup="dialog"><span class="nm" id="ghName"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="state" role="status"><span class="dot" id="dot"></span><span id="stateTxt"></span></div>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main class="wrap">
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-control"></section>
    <section class="view" id="v-history"></section>
    <section class="view" id="v-journal"></section>
    <section class="view" id="v-settings"></section>
    <section class="view" id="v-timeline"></section>
  </main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="box" id="sheetBox"></div></div>
<div class="exhibit" id="exhibit"></div>
<div id="report" hidden></div>
<div class="toast" id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-leaf" viewBox="0 0 64 64"><path d="M54 8C28 8 12 22 12 42c0 5 1 9 3 12 3-14 12-24 26-30-11 8-18 18-21 31 4 2 8 3 12 3 20 0 30-18 22-50Z" fill="var(--brand)"/></symbol>
</svg>
</body>
</html>
